{% extends "_base.html" %}

{% block page_title %}
    Add New Post
{% endblock page_title %}

{% block content %}
<div class="container my-5">
    <div class="row g-4">

        <main class="col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4">Add New Post</h1>

                    <form method="post"
                        {% csrf_token %}

                        {{form}}
                        
                        <button type="submit" >
                            Submit
                        </button>

                    </form>

                </div>
            </div>
        </main>

    </div>
</div>
{% endblock content %}
