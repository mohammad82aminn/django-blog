{% extends "_base.html" %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    <h1 class="mb-4">
                        Create New Post
                    </h1>


                    <form method="post"
                          action="{% url 'blog:post_create' %}">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            {{ form.title }}

                            {% if form.title.errors %}

                                <div class="text-danger mt-2">

                                    {{ form.title.errors }}

                                </div>

                            {% endif %}

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Content
                            </label>

                            {{ form.text }}


                            {% if form.text.errors %}

                                <div class="text-danger mt-2">

                                    {{ form.text.errors }}

                                </div>

                            {% endif %}

                        </div>



                        <button type="submit"
                                class="btn btn-primary">

                            Publish Post

                        </button>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>


{% endblock content %}
