{% extends "_base.html" %}

{% block page_title %}Blog{% endblock page_title %}

{% block content %}
    {% for post in post_list %}
        <article class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title h4">{{ post.title }}</h2>
                <p class="small text-body-secondary mb-3">By {{ post.author }}</p>
                <p class="card-text">{{ post.text }}</p>
                <a href="#" class="btn btn-primary btn-sm">Read More &rarr;</a>
            </div>
        </article>
    {% empty %}
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="card-text mb-0">No posts yet.</p>
            </div>
        </div>
    {% endfor %}
{% endblock content %}
