<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>

    {% for post in post_list %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.text }}</p>
        <p>By {{ post.author }} | {{ post.get_status_display }} | {{ post.datetime_created }}</p>
        <hr>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
